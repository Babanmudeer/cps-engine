services:
  - type: web
    name: cps-engine-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DB_NAME
        fromDatabase:
          name: cps-engine-db
          property: database

      - key: DB_USER
        fromDatabase:
          name: cps-engine-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: cps-engine-db
          property: password

      - key: DB_HOST
        fromDatabase:
          name: cps-engine-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: cps-engine-db
          property: port

      - key: REDIS_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-1.5-pro

      - key: TEMPERATURE
        value: "0.3"

      - key: MAX_TOKENS
        value: "2048"

      - key: GRAPH_NAME
        value: hausahistory

      - key: ENABLE_CACHE
        value: "true"

      - key: CACHE_TTL
        value: "3600"

      - key: API_KEY_DEV
        sync: false

      - key: API_KEY_PROD
        sync: false

      - key: API_KEY_ENTERPRISE
        sync: false

      - key: FRONTEND_URL
        sync: false

databases:
  - name: cps-engine-db
    databaseName: cps_engine
    user: cps_user
    plan: free
